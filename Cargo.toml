[package]
name = "autotun"
version = "1.0.0"
edition = "2024"
description = "TUI for discovering and toggling SSH port forwards over one connection"
license = "MIT"
repository = "https://github.com/thuanlm215/autotun"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
shell-words = "1.1"

[dev-dependencies]
tempfile = "3.20"
