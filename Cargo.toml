[package]
name = "autotun"
version = "1.4.2"
edition = "2024"
description = "TUI/GUI for SSH port forwards over one connection, plus clipboard image upload for remote CLIs"
license = "MIT"
repository = "https://github.com/thuanlm215/autotun"

[lib]
name = "autotun"
path = "src/lib.rs"

[[bin]]
name = "autotun"
path = "src/main.rs"

[[bin]]
name = "autotun-gui"
path = "src/bin/autotun_gui.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:eframe", "dep:serde"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
eframe = { version = "0.32", optional = true, features = ["persistence"] }
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"], optional = true }
shell-words = "1.1"

[dev-dependencies]
tempfile = "3.20"
