name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check formatting
        run: cargo fmt --check
      - name: Run tests
        run: cargo test --locked
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test installer
        run: tests/install.sh

  gui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev libx11-dev \
            libxcursor-dev libxi-dev libxrandr-dev libxss-dev libgl1-mesa-dev \
            libegl1-mesa-dev pkg-config
      - name: Check GUI
        run: cargo check --locked --features gui --bins
